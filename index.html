<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Encuentra y visita el trabajo y servicios de TRIGATARO Developer FullStack."
    >
    <meta name="theme-color" content="#080b1c">
    <title>TRIGATARO | Developer FullStack</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="container min-vh-100 d-flex flex-column align-items-center justify-content-start py-5">
      <section class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 text-center" aria-labelledby="page-title">
        <img
          class="img-fluid w-75 rounded-4 mb-3"
          src="img/logo.png"
          alt="TRIGATARO — Full Stack Developer"
          width="1254"
          height="1254"
        >

        <h1 id="page-title" class="visually-hidden">Encuéntranos en redes sociales</h1>
        <p class="text-secondary mb-4">Soluciones para tu negicio, en un solo lugar.</p>

        <nav class="d-grid gap-3" aria-label="Redes sociales">
          <a class="btn btn-dark border border-secondary rounded-4 d-flex align-items-center gap-3 w-100 p-3 text-start" href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-facebook-f fa-2x text-primary" aria-hidden="true"></i>
            <span class="d-flex flex-column">
              <span class="fw-semibold">Facebook</span>
              <span class="small text-secondary">Comunidad y novedades</span>
            </span>
            <i class="fa-solid fa-arrow-up-right-from-square ms-auto" aria-hidden="true"></i>
          </a>
          <a class="btn btn-dark border border-secondary rounded-4 d-flex align-items-center gap-3 w-100 p-3 text-start" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-youtube fa-2x text-danger" aria-hidden="true"></i>
            <span class="d-flex flex-column">
              <span class="fw-semibold">YouTube</span>
              <span class="small text-secondary">Videos y proyectos</span>
            </span>
            <i class="fa-solid fa-arrow-up-right-from-square ms-auto" aria-hidden="true"></i>
          </a>
          <a class="btn btn-dark border border-secondary rounded-4 d-flex align-items-center gap-3 w-100 p-3 text-start" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-instagram fa-2x text-danger" aria-hidden="true"></i>
            <span class="d-flex flex-column">
              <span class="fw-semibold">Instagram</span>
              <span class="small text-secondary">Ideas detrás de escena</span>
            </span>
            <i class="fa-solid fa-arrow-up-right-from-square ms-auto" aria-hidden="true"></i>
          </a>
          <a class="btn btn-dark border border-secondary rounded-4 d-flex align-items-center gap-3 w-100 p-3 text-start" href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-tiktok fa-2x text-info" aria-hidden="true"></i>
            <span class="d-flex flex-column">
              <span class="fw-semibold">TikTok</span>
              <span class="small text-secondary">Clips y contenido breve</span>
            </span>
            <i class="fa-solid fa-arrow-up-right-from-square ms-auto" aria-hidden="true"></i>
          </a>
          <a class="btn btn-dark border border-secondary rounded-4 d-flex align-items-center gap-3 w-100 p-3 text-start"
            href="https://wa.me/56975407155?text=Hola,%20me%20gustaría%20obtener%20más%20información"
            target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-whatsapp fa-2x text-success" aria-hidden="true"></i>
            <span class="d-flex flex-column">
              <span class="fw-semibold">WhatsApp</span>
              <span class="small text-secondary">Hablemos directamente</span>
            </span>
            <i class="fa-solid fa-arrow-up-right-from-square ms-auto" aria-hidden="true"></i>
          </a>
        </nav>

        <p class="text-secondary small mt-4 mb-0">Gracias por estar aquí.</p>
      </section>
    </main>
  </body>
</html>
